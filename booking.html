<section class="py-5 bg-light text-center">
    <div class="container">
        <h1 class="fw-bold">Travel Booking Form</h1>
        <p class="lead">Fill the form and submit your travel request</p>
    </div>
</section>


<section class="py-5">
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">

                <div class="card shadow-lg p-4 rounded-4">

                    <h3 class=" fw-bold mb-4 text-center">
                        Book Your Trip
                    </h3>
                    <form>
                    <div class="row">
                    <div classs="col-12 col-md-6 mb-3">
                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Enter Your Name">
                        </div>

                    <div classs="col-12 col-md-6 mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Enter Your email">
                        </div>
                    </div>
                    <div class="row">
                    <div classs="col-12 col-md-6 mb-3">
                       <label class="form-label">
                                Select Destination
                            </label>
                        <select class="form-select">
                            <option value="">Select Destination</option>
                            <option value="goa">Goa</option>
                            <option value="manali">Manali</option>
                            <option value="kerala">Kerala</option>
                        </select>
                    </div>
                    <div classs="col-12 col-md-6 mb-3">
                            <label class="form-label">
                                Travel Date
                            </label>

                            <input type="date"
                                   class="form-control"
                        </div>
                        </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Number of People
                    </label>
                    <input type="number"
                           class="form-control"
                           placeholder="Enter number of people">
                        </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Message / Requirement
                    </label>
                    <textarea class="form-control"
                              rows="4"
                              placeholder="Enter any travel requirements"></textarea>
                        </div>
                   <button type="submit"
                            class="btn btn-warning w-100">
                            Submit Booking Request
                        </button>
                    </form>
                    
                </div>
                    
            </div>
                    
        </div>
    </div>
    </section>
